name: Build Sneha AI APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Check Firebase configuration
      - name: Check google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "ERROR: app/google-services.json not found!"
            exit 1
          fi

          echo "google-services.json found."

      # 5. Make Gradle executable
      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew

      # 6. Build APK
      - name: Build Debug APK
        run: |
          ./gradlew clean :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # 7. Check APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty!"
            exit 1
          fi

          echo "APK successfully created."
          ls -lh "$APK"

      # 8. Verify APK structure
      - name: Verify APK ZIP
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sneha-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 10. Create GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sneha-ai-build-${{ github.run_number }}"

          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Sneha AI APK #${{ github.run_number }}" \
            --notes "Sneha AI Android debug APK built automatically by GitHub Actions." \
            --target "${{ github.sha }}"
