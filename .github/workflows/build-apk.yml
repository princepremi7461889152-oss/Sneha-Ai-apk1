name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')

          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect active Java version."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_VER"

          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or newer."
            exit 1
          fi

          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore already exists."
          else
            echo "Generating temporary debug keystore..."

            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create debug keystore."
            exit 1
          fi

          echo "Debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: APK not found at $TARGET_APK"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo "APK successfully verified."
          echo "APK size: $(stat -c%s "$TARGET_APK") bytes"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="${TEMP_RELEASE_DIR}/app-debug.apk"

          cp "$SOURCE_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Failed to prepare APK release asset."
            exit 1
          fi

          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK does not exist."
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK is empty."
            exit 1
          fi

          ASSET_NAME=$(basename "$ASSET_PATH")

          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename must be app-debug.apk"
            echo "Found: $ASSET_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES="Automatically generated debug APK."
          NOTES="$NOTES Built by GitHub Actions."
          NOTES="$NOTES Run number: ${{ github.run_number }}."
          NOTES="$NOTES Run attempt: ${{ github.run_attempt }}."
          NOTES="$NOTES Source commit: ${{ github.sha }}."
          NOTES="$NOTES APK is intended for testing."
          NOTES="$NOTES APK is not a Play Store production release."
          NOTES="$NOTES APK uses a temporary debug keystore."

          echo "Creating release: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "Release created successfully!"

            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"

            gh release view "$RELEASE_TAG" || true

            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release Tag: $RELEASE_TAG"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"

            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions artifact app-debug-apk is also available."

          else
            echo "WARNING: GitHub Release publishing failed or was skipped."

            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded."
              echo "Artifact app-debug-apk was uploaded."
            fi
          fi
