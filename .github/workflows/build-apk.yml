      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK is empty"
            exit 1
          fi

          ASSET_NAME=$(basename "$ASSET_PATH")

          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename must be app-debug.apk"
            echo "Found: $ASSET_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES="This is an automatically generated debug APK."
          NOTES="$NOTES The APK was built by GitHub Actions."
          NOTES="$NOTES GitHub Actions run number: ${{ github.run_number }}"
          NOTES="$NOTES GitHub Actions run attempt: ${{ github.run_attempt }}"
          NOTES="$NOTES Source commit SHA: ${{ github.sha }}"
          NOTES="$NOTES APK is intended for testing."
          NOTES="$NOTES APK is not a Play Store production release."
          NOTES="$NOTES APK is signed only with a temporary debug keystore."

          echo "Creating release: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest
