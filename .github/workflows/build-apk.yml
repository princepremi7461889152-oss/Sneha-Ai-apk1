name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Java
        run: java -version

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find app/build/outputs -type f -name "*.apk" -print

      - name: Verify APK exists
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty!"
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

      - name: Verify APK ZIP integrity
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          unzip -t "$APK"

          echo "APK ZIP structure is valid."

      - name: Verify APK with Android SDK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found!"
            exit 1
          fi

          echo "Using: $APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

      - name: Show APK SHA256
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          sha256sum "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sneha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          TAG="sneha-debug-${{ github.run_number }}"

          gh release create "$TAG" \
            "$APK" \
            --title "Sneha Debug APK #${{ github.run_number }}" \
            --notes "Sneha Android Debug APK generated by GitHub Actions." \
            --target "${{ github.sha }}"

      - name: Show Download URL
        if: success()
        run: |
          echo "========================================"
          echo "SNEHA APK BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "APK:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/sneha-debug-${{ github.run_number }}"
          echo ""
          echo "SHA256:"
          sha256sum app/build/outputs/apk/debug/app-debug.apk
